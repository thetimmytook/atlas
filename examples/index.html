<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas example</title>
    <style>
      body {
        margin: 24px;
        font-family: system-ui, sans-serif;
        color: #233044;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 16px;
        padding: 0;
        border: 0;
      }

      button {
        min-width: 44px;
        min-height: 44px;
        cursor: pointer;
      }

      .map-frame {
        width: min(800px, 100%);
        height: 480px;
        min-width: 160px;
        min-height: 120px;
        max-width: 100%;
        resize: both;
        overflow: hidden;
        border: 1px solid #9aadc4;
      }

      atlas-map {
        width: 100%;
        height: 100%;
        background: #edf2f8;
      }
    </style>
  </head>
  <body>
    <h1>Atlas map component</h1>
    <p>Factory ground floor. Drag the frame's bottom-right corner to resize it.</p>
    <p id="status" role="status">Loading map…</p>
    <fieldset class="controls" aria-label="Map camera" disabled>
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
      <button type="button" id="fit">Fit map</button>
      <button type="button" id="left" aria-label="Move camera left">←</button>
      <button type="button" id="up" aria-label="Move camera up">↑</button>
      <button type="button" id="down" aria-label="Move camera down">↓</button>
      <button type="button" id="right" aria-label="Move camera right">→</button>
    </fieldset>
    <div class="map-frame">
      <atlas-map role="region" aria-label="Map preview"></atlas-map>
    </div>
    <script type="module">
      import { AtlasMap, Point } from '../src/index.ts';

      customElements.define('atlas-map', AtlasMap);

      const map = document.querySelector('atlas-map');
      const status = document.querySelector('#status');
      const definition = {
        background: {
          source: new URL('./factory/Factory-ground-floor.svg', import.meta.url).href,
          width: 130.81831,
          height: 141.23242,
        },
      };

      const move = (x, y) => {
        const { center, zoom } = map.camera;
        map.camera.center = new Point(center.x + x / zoom, center.y + y / zoom);
      };
      document.querySelector('#zoom-in').onclick = () => {
        map.camera.zoom *= 1.25;
      };
      document.querySelector('#zoom-out').onclick = () => {
        map.camera.zoom /= 1.25;
      };
      document.querySelector('#fit').onclick = () => map.fit();
      document.querySelector('#left').onclick = () => move(-50, 0);
      document.querySelector('#right').onclick = () => move(50, 0);
      document.querySelector('#up').onclick = () => move(0, -50);
      document.querySelector('#down').onclick = () => move(0, 50);

      try {
        await map.load(definition);
        status.textContent = 'Factory ground floor loaded.';
        document.querySelector('.controls').disabled = false;
      } catch (error) {
        status.textContent = error.message;
      }
    </script>
  </body>
</html>
